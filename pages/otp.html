<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Affan - PWA Mobile HTML Template">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <!-- The above 4 meta tags *must* come first in the head; any other head content must come *after* these tags -->

  <meta name="theme-color" content="#0134d4">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <!-- Title -->
  <title>Affan - PWA Mobile HTML Template</title>

  <!-- Favicon -->
  <link rel="icon" href="assets/img/core-img/favicon.ico">
  <link rel="apple-touch-icon" href="assets/img/icons/icon-96x96.png">
  <link rel="apple-touch-icon" sizes="152x152" href="assets/img/icons/icon-152x152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="assets/img/icons/icon-167x167.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/icons/icon-180x180.png">

  <!-- Style CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <!-- Preloader -->
  <div id="preloader">
    <div class="spinner-grow text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <!-- Back Button -->
  <div class="login-back-button">
    <a href="register.html">
      <i class="ti ti-arrow-left"></i>
    </a>
  </div>

  <!-- Login Wrapper Area -->
  <div class="login-wrapper d-flex align-items-center justify-content-center">
    <div class="custom-container">
      <div class="text-center">
        <img class="mx-auto mb-4 d-block" src="assets/img/bg-img/36.png" alt="">
        <h2>Phone Verification</h2>
        <p>We will send you an OTP code on this phone number.</p>
      </div>

      <!-- OTP Send Form -->
      <div class="otp-form mt-4">
        <form action="otp-confirm.html">
          <div class="input-group mb-3">
            <select class="input-group-text affan-nice-select nice-select" name="dialingcode"
              aria-label="Default select example">
              <option value="+1">+1</option>
              <option value="+7">+7</option>
              <option value="+20">+20</option>
              <option value="+27">+27</option>
              <option value="+30">+30</option>
              <option value="+31">+31</option>
              <option value="+32">+32</option>
              <option value="+33">+33</option>
              <option value="+34">+34</option>
              <option value="+36">+36</option>
              <option value="+39">+39</option>
              <option value="+40">+40</option>
              <option value="+41">+41</option>
              <option value="+43">+43</option>
              <option value="+44">+44</option>
              <option value="+45">+45</option>
              <option value="+46">+46</option>
              <option value="+47">+47</option>
              <option value="+48">+48</option>
              <option value="+49">+49</option>
              <option value="+51">+51</option>
              <option value="+52">+52</option>
              <option value="+53">+53</option>
              <option value="+54">+54</option>
              <option value="+55">+55</option>
              <option value="+56">+56</option>
              <option value="+57">+57</option>
              <option value="+58">+58</option>
              <option value="+60">+60</option>
              <option value="+61">+61</option>
              <option value="+62">+62</option>
              <option value="+63">+63</option>
              <option value="+64">+64</option>
              <option value="+65">+65</option>
              <option value="+66">+66</option>
              <option value="+81">+81</option>
              <option value="+82">+82</option>
              <option value="+84">+84</option>
              <option value="+86">+86</option>
              <option value="+90">+90</option>
              <option value="+91">+91</option>
              <option value="+92">+92</option>
              <option value="+93">+93</option>
              <option value="+94">+94</option>
              <option value="+95">+95</option>
              <option value="+98">+98</option>
              <option value="+211">+211</option>
              <option value="+212">+212</option>
              <option value="+213">+213</option>
              <option value="+216">+216</option>
              <option value="+218">+218</option>
              <option value="+220">+220</option>
              <option value="+221">+221</option>
              <option value="+234">+234</option>
              <option value="+880" selected>+880</option>
            </select>
            <input class="form-control" type="text" placeholder="Enter phone number">
          </div>
          <button class="btn btn-primary w-100" type="submit">Send Now <i class="ti ti-arrow-right"></i></button>
        </form>
      </div>

      <!-- Term & Privacy Info -->
      <div class="login-meta-data px-4 text-center">
        <p class="mt-3 mb-0">By providing my phone number, I hereby agree the
          <a class="stretched-link" href="privacy-policy.html">Term of Services</a>
          and
          <a class="stretched-link" href="privacy-policy.html">Privacy Policy.</a>
        </p>
      </div>
    </div>
  </div>

  <!-- All JavaScript Files -->
  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/slideToggle.min.js"></script>
  <script src="assets/js/internet-status.js"></script>
  <script src="assets/js/tiny-slider.js"></script>
  <script src="assets/js/venobox.min.js"></script>
  <script src="assets/js/countdown.js"></script>
  <script src="assets/js/rangeslider.min.js"></script>
  <script src="assets/js/vanilla-dataTables.min.js"></script>
  <script src="assets/js/index.js"></script>
  <script src="assets/js/imagesloaded.pkgd.min.js"></script>
  <script src="assets/js/isotope.pkgd.min.js"></script>
  <script src="assets/js/nice-select2.js"></script>
  <script src="assets/js/dark-rtl.js"></script>
  <script src="assets/js/active.js"></script>
  <script src="assets/js/pwa.js"></script>
</body>

</html>
