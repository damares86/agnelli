<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Affan - PWA Mobile HTML Template">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <!-- The above 4 meta tags *must* come first in the head; any other head content must come *after* these tags -->

  <meta name="theme-color" content="#0134d4">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <!-- Title -->
  <title>Affan - PWA Mobile HTML Template</title>

  <!-- Favicon -->
  <link rel="icon" href="assets/img/core-img/favicon.ico">
  <link rel="apple-touch-icon" href="assets/img/icons/icon-96x96.png">
  <link rel="apple-touch-icon" sizes="152x152" href="assets/img/icons/icon-152x152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="assets/img/icons/icon-167x167.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/icons/icon-180x180.png">

  <!-- Style CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <!-- Preloader -->
  <div id="preloader">
    <div class="spinner-grow text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <!-- Setting Popup Overlay -->
  <div id="setting-popup-overlay"></div>

  <!-- Setting Popup Card -->
  <div class="card setting-popup-card shadow-lg" id="settingCard">
    <div class="card-body">
      <div class="container">
        <div class="setting-heading d-flex align-items-center justify-content-between mb-3">
          <p class="mb-0">Settings</p>
          <div class="btn-close" id="settingCardClose"></div>
        </div>

        <div class="single-setting-panel">
          <div class="form-check form-switch mb-2">
            <input class="form-check-input" type="checkbox" id="availabilityStatus" checked>
            <label class="form-check-label" for="availabilityStatus">Availability status</label>
          </div>
        </div>

        <div class="single-setting-panel">
          <div class="form-check form-switch mb-2">
            <input class="form-check-input" type="checkbox" id="sendMeNotifications" checked>
            <label class="form-check-label" for="sendMeNotifications">Send me notifications</label>
          </div>
        </div>

        <div class="single-setting-panel">
          <div class="form-check form-switch mb-2">
            <input class="form-check-input" type="checkbox" id="darkSwitch">
            <label class="form-check-label" for="darkSwitch">Dark mode</label>
          </div>
        </div>

        <div class="single-setting-panel">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="rtlSwitch">
            <label class="form-check-label" for="rtlSwitch">RTL mode</label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Header Area -->
  <div class="header-area" id="headerArea">
    <div class="container">
      <!-- Header Content -->
      <div class="header-content position-relative d-flex align-items-center justify-content-between">
        <!-- Back Button -->
        <div class="back-button">
          <a href="elements.html">
            <i class="ti ti-arrow-left"></i>
          </a>
        </div>

        <!-- Page Title -->
        <div class="page-heading">
          <h6 class="mb-0">Input group</h6>
        </div>

        <!-- Settings -->
        <div class="setting-wrapper">
          <div class="setting-trigger-btn" id="settingTriggerBtn">
            <i class="ti ti-settings"></i>
            <span></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="page-content-wrapper py-3">
    <!-- Element Heading -->
    <div class="container">
      <div class="element-heading">
        <h6>Input group</h6>
      </div>
    </div>

    <div class="container">
      <div class="card">
        <div class="card-body">
          <form action="#" method="GET">
            <div class="input-group mb-3">
              <span class="input-group-text" id="basic-addon1">@</span>
              <input class="form-control" type="text" placeholder="Designing World" aria-label="Username"
                aria-describedby="basic-addon1">
            </div>

            <div class="input-group mb-3">
              <input class="form-control" type="text" placeholder="care.designingworld"
                aria-label="Recipient's username" aria-describedby="basic-addon2">
              <span class="input-group-text" id="basic-addon2">@gmail.com</span>
            </div>

            <label class="form-label" for="basic-url">Your profile URL</label>
            <div class="input-group mb-3">
              <span class="input-group-text" id="basic-addon3">themeforest.net/user/</span>
              <input class="form-control" id="basic-url" type="text" aria-describedby="basic-addon3"
                placeholder="designing-world">
            </div>

            <div class="input-group mb-3">
              <span class="input-group-text">Price</span>
              <input class="form-control" type="text" aria-label="Amount (to the nearest dollar)" placeholder="24">
              <span class="input-group-text">$</span>
            </div>

            <div class="input-group mb-3">
              <div class="input-group-text">
                <input class="form-check-input" type="checkbox" value="" aria-label="Checkbox for following text input">
              </div>
              <input class="form-control" type="text" aria-label="Text input with checkbox" placeholder="Checkbox">
            </div>

            <div class="input-group mb-3">
              <div class="input-group-text">
                <input class="form-check-input" type="radio" value=""
                  aria-label="Radio button for following text input">
              </div>
              <input class="form-control" type="text" aria-label="Text input with radio button" placeholder="Radio">
            </div>

            <div class="input-group mb-3">
              <span class="input-group-text">Name</span>
              <input class="form-control" type="text" aria-label="First name" placeholder="First name">
              <input class="form-control" type="text" aria-label="Last name" placeholder="Last name">
            </div>

            <div class="input-group mb-3">
              <button class="btn btn-primary dropdown-toggle" type="button" data-bs-toggle="dropdown"
                aria-expanded="false">Dropdown</button>
              <ul class="dropdown-menu">
                <li>
                  <a class="dropdown-item" href="#">Search By Name</a>
                </li>
                <li>
                  <a class="dropdown-item" href="#">Search By Price</a>
                </li>
                <li>
                  <a class="dropdown-item" href="#">Search By Date</a>
                </li>
              </ul>
              <input class="form-control" type="text" aria-label="Text input with dropdown button">
            </div>

            <div class="input-group">
              <span class="input-group-text">Message</span>
              <textarea class="form-control" aria-label="With textarea"
                placeholder="Hello, Designing World!"></textarea>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer Nav -->
  <div class="footer-nav-area" id="footerNav">
    <div class="container px-0">
      <!-- Footer Content -->
      <div class="footer-nav position-relative">
        <ul class="h-100 d-flex align-items-center justify-content-between ps-0">
          <li class="active">
            <a href="home.html">
              <i class="ti ti-home"></i>
              <span>Home</span>
            </a>
          </li>

          <li>
            <a href="pages.html">
              <i class="ti ti-folders"></i>
              <span>Pages</span>
            </a>
          </li>

          <li>
            <a href="elements.html">
              <i class="ti ti-heart"></i>
              <span>Elements</span>
            </a>
          </li>

          <li>
            <a href="settings.html">
              <i class="ti ti-settings"></i>
              <span>Settings</span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <!-- All JavaScript Files -->
  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/slideToggle.min.js"></script>
  <script src="assets/js/internet-status.js"></script>
  <script src="assets/js/tiny-slider.js"></script>
  <script src="assets/js/venobox.min.js"></script>
  <script src="assets/js/countdown.js"></script>
  <script src="assets/js/rangeslider.min.js"></script>
  <script src="assets/js/vanilla-dataTables.min.js"></script>
  <script src="assets/js/index.js"></script>
  <script src="assets/js/imagesloaded.pkgd.min.js"></script>
  <script src="assets/js/isotope.pkgd.min.js"></script>
  <script src="assets/js/nice-select2.js"></script>
  <script src="assets/js/dark-rtl.js"></script>
  <script src="assets/js/active.js"></script>
  <script src="assets/js/pwa.js"></script>
</body>

</html>
